# 发布流水线。
# 基准：上游 Jasons-impart/Create-Delight-Project-Rebirth 的 .github/workflows/release.yml
# （2026-09-24 起本仓库直接采用上游这套，目的就是减少分叉、方便后续合并）。
# 与上游的差异只有下面三处，改这个文件时请同步更新这段说明：
#   1. 不发 CurseForge：去掉 `bkmpw export-curseforge` 步骤与 `--curseforge` 校验开关
#      （本仓库没有 STUDIO_CURSEFORGE_API_KEY，也确定只发 GitHub Release）。
#   2. 不跑 `bkmpw update create-delight-core`（该命令要走 CurseForge 查询、需要 key）；
#      Core 版本由 `mods/common/create-delight-core.pw.toml` 决定，随提交走。
#   3. Release 一律「测试版 / 预发布」：标题固定 `<tag> 测试版`、固定带 --prerelease，
#      即使 pack 版本号不带 -testN 也只发测试版（本仓库约定：不发布正式版）。
#   4. 发布包校验按本仓实际工具链行为修正（在 `scripts/validate-release-artifacts.py`，不在本文件）：
#      bkmpw 0.1.1 的 `export-client` / `export-server` 是**已展开**的全量包、**不含描述符**
#      （描述符只在 `export-server-installer` 里），所以 full 分支不再要求描述符齐全；
#      另放行随仓分发的自制材质包 `no-vanilla-sun.zip`。合并上游时注意别被覆盖回去（见 MIGRATION_LOG P-174）。
# 版本号规则（与上游一致）：pack/pack.toml 必须形如 vA.B.C.D 或 vA.B.C.D-testN；
# 打 tag 前先用 `devtool.bat set-version <版本>` 同步并提交，tag 必须与 pack 版本完全一致。
name: 发布版本

on:
  push:
    branches:
      - main
      - test-*
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BKMPW_PACKAGE: '@bro-know-my/packwiz@latest'

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      modpack_name: ${{ steps.read.outputs.name }}
      modpack_version: ${{ steps.version.outputs.version }}
      mc_version: ${{ steps.read.outputs.mc }}
      neoforge_version: ${{ steps.read.outputs.neoforge }}
      is_stable_release: ${{ steps.version.outputs.is_stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: pack/pack.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: 读取 pack 信息
        id: read
        run: |
          name=$(grep -m1 '^name' pack/pack.toml | cut -d'"' -f2)
          version=$(grep -m1 '^version' pack/pack.toml | cut -d'"' -f2)
          mc=$(grep -m1 '^minecraft' pack/pack.toml | cut -d'"' -f2)
          neoforge=$(grep -m1 '^neoforge' pack/pack.toml | cut -d'"' -f2)
          echo "name=$name" >> $GITHUB_OUTPUT
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "mc=$mc" >> $GITHUB_OUTPUT
          echo "neoforge=$neoforge" >> $GITHUB_OUTPUT
      - name: 计算发布版本号与渠道
        id: version
        env:
          PACK_VERSION: ${{ steps.read.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="$PACK_VERSION"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-test[0-9]+)?$ ]]; then
            echo "pack/pack.toml version '$VERSION' 不符合 vA.B.C.D 或 vA.B.C.D-testN 格式" >&2
            exit 1
          fi
          IS_STABLE=true
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "$VERSION" ]]; then
              echo "tag '$GITHUB_REF_NAME' 与 pack/pack.toml version '$VERSION' 不一致，先运行 devtool set-version 并提交" >&2
              exit 1
            fi
            [[ "$VERSION" == *-test* ]] && IS_STABLE=false
          else
            VERSION="${VERSION%-test*}-test-build-${GITHUB_RUN_NUMBER}"
            IS_STABLE=false
          fi
          if [[ "$IS_STABLE" == "true" ]]; then
            echo "::warning::pack/pack.toml 版本 $VERSION 不带 -testN；按本仓库约定仍以「测试版 / 预发布」发布"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_stable=$IS_STABLE" >> $GITHUB_OUTPUT

  cache-seed:
    needs: metadata
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 bkmpw
        run: npm install -g ${{ env.BKMPW_PACKAGE }}
      - name: 展开本地发布文件并刷新索引
        run: node scripts/devtool.mjs prepare-pack
      - uses: actions/cache@v4
        id: modjar-cache
        with:
          path: |
            mods/*.jar
            packwiz.json
          key: mods-jars-${{ hashFiles('mods/**/*.pw.toml') }}
          restore-keys: mods-jars-
      - name: 同步托管文件（仅用于种缓存）
        run: bkmpw install-files-headless . 3 10

  build:
    needs: metadata
    if: github.event_name != 'push' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODPACK_VERSION: ${{ needs.metadata.outputs.modpack_version }}
      MODPACK_NAME: ${{ needs.metadata.outputs.modpack_name }}
      MC_VERSION: ${{ needs.metadata.outputs.mc_version }}
      NEOFORGE_VERSION: ${{ needs.metadata.outputs.neoforge_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装 bkmpw
        run: npm install -g ${{ env.BKMPW_PACKAGE }}
      - name: 注入构建版本号
        run: node scripts/devtool.mjs set-version "${MODPACK_VERSION}"
      - name: 展开本地发布文件并刷新索引
        run: node scripts/devtool.mjs prepare-pack
      - uses: actions/cache@v4
        id: modjar-cache
        with:
          path: |
            mods/*.jar
            packwiz.json
          key: mods-jars-${{ hashFiles('mods/**/*.pw.toml') }}
          restore-keys: mods-jars-
      - name: 同步托管文件
        run: bkmpw install-files-headless . 3 10
      - name: 检查仓库结构
        run: node scripts/devtool.mjs check
      - name: 生成并校验完整性清单
        run: |
          node scripts/devtool.mjs generate-integrity-manifest
          python3 scripts/validate-integrity-manifest.py
      - name: 生成更新器发版信息
        run: |
          mkdir -p artifacts
          jq -n \
            --arg version "$MODPACK_VERSION" \
            --arg commitId "$GITHUB_SHA" \
            --arg minecraftVersion "$MC_VERSION" \
            --arg neoforgeVersion "$NEOFORGE_VERSION" \
            '{schemaVersion: 1, version: $version, commitId: $commitId, minecraftVersion: $minecraftVersion, neoforgeVersion: $neoforgeVersion}' \
            > artifacts/release-info.json
          cp artifacts/release-info.json config/createdelight_release_info.json
          node scripts/devtool.mjs refresh
      - name: 导出客户端全量包
        run: bkmpw export-client . "artifacts/[Client-Full]${MODPACK_NAME}-${MODPACK_VERSION}.zip"
      - name: 导出开箱即用服务端包
        run: bkmpw export-server . "artifacts/[Server]${MODPACK_NAME}-${MODPACK_VERSION}.zip"
      - name: 导出 bkmpw 下载型服务端安装包
        run: bkmpw export-server-installer . "artifacts/[Server-Installer]${MODPACK_NAME}-${MODPACK_VERSION}.zip"
      - name: 验证发布包内容
        run: python3 scripts/validate-release-artifacts.py artifacts "$MODPACK_NAME" "$MODPACK_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/*.zip
            artifacts/release-info.json
          if-no-files-found: error

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      MODPACK_VERSION: ${{ needs.metadata.outputs.modpack_version }}
    steps:
      - name: 创建或确认草稿 Release（固定预发布 / 测试版）
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft >/dev/null 2>&1; then
            is_draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $GITHUB_REF_NAME is already public" >&2
              exit 1
            fi
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME 测试版" --generate-notes --draft --prerelease
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: release-assets
      - name: 上传 Release 资产至草稿
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*.zip release-assets/release-info.json)
          if [[ "${#assets[@]}" -ne 4 || ! -f release-assets/release-info.json ]]; then
            echo "Expected 3 release archives and release-info.json, got ${#assets[@]} assets" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            # gh release upload 会把 [] 当作 glob；转义文件名中的方括号。
            escaped_asset="${asset//[/\\[}"
            escaped_asset="${escaped_asset//]/\\]}"
            for attempt in {1..5}; do
              if gh release upload "$GITHUB_REF_NAME" "$escaped_asset" --repo "$GITHUB_REPOSITORY" --clobber; then
                break
              fi
              if [[ "$attempt" == "5" ]]; then
                echo "Failed to upload $(basename "$asset")" >&2
                exit 1
              fi
              sleep 15
            done
          done
      - name: 公开 Release（预发布）
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
